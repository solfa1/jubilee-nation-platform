services:
  postgres:
    image: postgres:16-alpine
    container_name: jn-postgres
    restart: unless-stopped
    
    environment:
      POSTGRES_DB: jubilee_nation
      POSTGRES_USER: jubileeguy
      POSTGRES_PASSWORD: jubileeshow
    
    ports:
      - "5436:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jubileeguy -d jubilee_nation"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
